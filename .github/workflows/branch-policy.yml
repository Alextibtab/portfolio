on:
  pull_request:
    branches: [main]
jobs:
  check-source:
    runs-on: ubuntu-lastest
    steps:
      - run: |
          if [[ "${{ github.head_ref }}" != "develop" && "${{ github.head_ref }}" != hotfix/* ]]; then
            echo "::error::Only develop or hotfix/* may target main"; exit 1
          fi
